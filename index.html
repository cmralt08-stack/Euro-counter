<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euro Cash Counter</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Euro Counter">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --accent: #b56aff;
    --accent2: #ff6ab5;
    --text: #f0f0f0;
    --muted: #999;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 12px 24px;
    min-height: 100vh;
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .group-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 18px 0 8px;
  }
  .row {
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #222;
  }
  .denom {
    width: 70px;
    font-weight: 600;
    font-size: 1rem;
  }
  .row input {
    flex: 1;
    margin: 0 12px;
    background: #1e1e1e;
    border: 1px solid #333;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 1rem;
    text-align: center;
    width: 60px;
  }
  .row input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .subtotal {
    width: 70px;
    text-align: right;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .total-card {
    margin-top: 24px;
    background: linear-gradient(135deg, rgba(181,106,255,0.15), rgba(255,106,181,0.15));
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
  }
  .total-label {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 4px;
  }
  .total-value {
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .reset-btn {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: 1px solid #333;
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .reset-btn:hover, .reset-btn:active {
    border-color: var(--accent);
    color: var(--text);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Euro Cash Counter</h1>
  <div class="subtitle">Enter how many of each note or coin you have</div>

  <div class="group-label">Notes</div>
  <div id="notes"></div>

  <div class="group-label">Coins</div>
  <div id="coins"></div>

  <div class="total-card">
    <div class="total-label">Total</div>
    <div class="total-value" id="total">€0.00</div>
  </div>

  <button class="reset-btn" onclick="resetAll()">Reset all</button>
</div>

<script>
  const notes = [500, 200, 100, 50, 20, 10, 5];
  const coins = [2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01];

  function fmt(v) {
    return v % 1 === 0 ? v.toString() : v.toFixed(2).replace(/0$/, '');
  }

  function buildRow(value) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <div class="denom">€${fmt(value)}</div>
      <input type="number" min="0" step="1" inputmode="numeric" placeholder="0" data-value="${value}" oninput="update()">
      <div class="subtotal" id="sub-${value}">€0.00</div>
    `;
    return row;
  }

  const notesEl = document.getElementById('notes');
  const coinsEl = document.getElementById('coins');
  notes.forEach(v => notesEl.appendChild(buildRow(v)));
  coins.forEach(v => coinsEl.appendChild(buildRow(v)));

  function update() {
    let total = 0;
    document.querySelectorAll('input[data-value]').forEach(input => {
      const value = parseFloat(input.dataset.value);
      const count = parseInt(input.value) || 0;
      const subtotal = value * count;
      total += subtotal;
      const subEl = document.getElementById(`sub-${value}`);
      if (subEl) subEl.textContent = `€${subtotal.toFixed(2)}`;
    });
    document.getElementById('total').textContent = `€${total.toFixed(2)}`;
  }

  function resetAll() {
    document.querySelectorAll('input[data-value]').forEach(input => input.value = '');
    update();
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
